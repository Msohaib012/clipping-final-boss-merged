name: Build Windows .exe

# Same proven pattern as the YT Clip Tool (Msohaib012/yt-clip-tool) and the
# GTA 6 Live Clipper (Msohaib012/gta6-live-clipper): Windows runner,
# PyInstaller onefile, ffmpeg/ffprobe/yt-dlp.exe bundled, GitHub Release.
# v1.0.0 — first CFB Clipper Windows build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Download ffmpeg + ffprobe (Windows)
        shell: powershell
        run: |
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            try {
              Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip -ErrorAction Stop
              $ok = $true
            } catch {
              Write-Host "gyan.dev attempt $i failed: $($_.Exception.Message)"
              Start-Sleep -Seconds 20
            }
          }
          if (-not $ok) {
            Write-Host "gyan.dev unavailable - falling back to BtbN FFmpeg-Builds (GitHub release)"
            Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          Get-ChildItem ffmpeg_dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName -Destination .\ffmpeg.exe }
          Get-ChildItem ffmpeg_dl -Recurse -Filter ffprobe.exe | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName -Destination .\ffprobe.exe }
          .\ffmpeg.exe -version
          .\ffprobe.exe -version

      - name: Download yt-dlp.exe (standalone, official release)
        shell: powershell
        run: |
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            try {
              Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile yt-dlp.exe -ErrorAction Stop
              $ok = $true
            } catch {
              Write-Host "yt-dlp download attempt $i failed: $($_.Exception.Message)"
              Start-Sleep -Seconds 20
            }
          }
          if (-not $ok) { throw "yt-dlp.exe download failed after 3 attempts" }
          .\yt-dlp.exe --version

      - name: Build .exe with PyInstaller (onefile)
        run: |
          pyinstaller --onefile --clean --noconfirm --name CFB-Clipper --console --add-data "clipper/web;clipper/web" --add-data "clipper/models;clipper/models" --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." --add-binary "yt-dlp.exe;." --collect-all yt_dlp --collect-all faster_whisper --collect-all ctranslate2 --collect-all av --collect-all mediapipe --collect-all cv2 --collect-all uvicorn --collect-all fastapi --collect-all onnxruntime --collect-all tokenizers --collect-all huggingface_hub --collect-all googleapiclient --collect-all google_auth_oauthlib --collect-all chat_downloader --collect-all dotenv --collect-all numpy --collect-all PIL --collect-all pydantic --collect-all starlette --collect-all anyio --collect-all httpx --collect-all websockets --collect-all absl --collect-all protobuf --collect-all flatbuffers --collect-all tqdm run.py
          dir dist

      - name: Make portable ZIP (.exe + ffmpeg + ffprobe + yt-dlp)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item dist\CFB-Clipper.exe -Destination portable\
          Copy-Item ffmpeg.exe -Destination portable\
          Copy-Item ffprobe.exe -Destination portable\
          Copy-Item yt-dlp.exe -Destination portable\
          Compress-Archive -Path portable\* -DestinationPath CFB-Clipper-Portable.zip -Force
          Get-ChildItem CFB-Clipper-Portable.zip | Select-Object Name, Length

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFB-Clipper-Windows
          path: dist/CFB-Clipper.exe

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFB-Clipper-Portable
          path: CFB-Clipper-Portable.zip

      - name: Publish GitHub Release (v1.0.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: CFB Clipper v1.0.0 (Windows)
          body: |
            Portable Windows build — double-click CFB-Clipper.exe, no Python install needed.
            **Recommended: CFB-Clipper-Portable.zip** — extract it anywhere and run CFB-Clipper.exe (ffmpeg + ffprobe + yt-dlp are included next to it).
            The single .exe also works, with ffmpeg bundled inside.
            The browser opens at http://127.0.0.1:8000 automatically.
            Paste a YouTube link or a local video file, pick a clip, render a vertical Short with stage layout, gold frame and Roman captions.
            First run downloads the Whisper speech model (tiny ~75 MB, needs internet once).
            YouTube auto-captions + Gemini Roman rewrite give the cleanest Hindi/Urdu captions for video links; local files use Whisper (last seconds of noisy Hindi audio may still mishear).
            A/V sync OCR needs tesseract on the PC (optional — without it clips still render, sync measurement is skipped).
            v1.0.0: first Windows release — merged Clipping Final Boss + his clipper's layouts (14 framing modes), 11 frame styles (gold default), Roman captions + word retiming, A/V sync, Gemini wording gate (off by default).
          files: |
            dist/CFB-Clipper.exe
            CFB-Clipper-Portable.zip
